[workspace]
resolver = "2"
members = [
    "crates/inbrisk-core",
    "crates/inbrisk-protocol",
    "crates/inbrisk-ipc",
    "crates/inbrisk-policy",
    "crates/inbrisk-win32",
    "crates/inbrisk-uia",
    "crates/inbrisk-cdp",
    "crates/inbrisk-input",
    "crates/inbrisk-runtime",
    "crates/inbrisk-sdk",
    "crates/inbrisk-ui",
    "crates/inbrisk-mcp",
    "crates/inbrisk-ffi",
    "apps/inbrisk",
    "apps/inbrisk-cli",
    "apps/inbrisk-mcp",
    "apps/inbrisk-desktop",
    "apps/inbrisk-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "proprietary"
authors = ["DarkHSoul"]

[workspace.dependencies]
inbrisk-core = { path = "crates/inbrisk-core" }
inbrisk-protocol = { path = "crates/inbrisk-protocol" }
inbrisk-ipc = { path = "crates/inbrisk-ipc" }
inbrisk-policy = { path = "crates/inbrisk-policy" }
inbrisk-win32 = { path = "crates/inbrisk-win32" }
inbrisk-uia = { path = "crates/inbrisk-uia" }
inbrisk-cdp = { path = "crates/inbrisk-cdp" }
inbrisk-input = { path = "crates/inbrisk-input" }
inbrisk-runtime = { path = "crates/inbrisk-runtime" }
inbrisk-sdk = { path = "crates/inbrisk-sdk" }
inbrisk-ui = { path = "crates/inbrisk-ui" }
inbrisk-mcp = { path = "crates/inbrisk-mcp" }
inbrisk-ffi = { path = "crates/inbrisk-ffi" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
once_cell = "1"
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_JobObjects",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
